name: Consistency

# 擋「workflow 寫死的合約位址與前端設定不一致」。
#
# 2026-09-29 發現三支 workflow（keeper／健檢／admin）仍指向舊 exchange，對一顆已經
# 沒人用的合約正常運作、CI 全綠（#178 修正）。位址唯一真相是
# frontend/src/contracts/addresses.ts（＋ V2_STACK、sessionManager.ts）；這支 job
# 把 .github/workflows/*.yml 裡所有值為位址的 env 鍵與它比對，對不上就紅。
#
# 刻意不加 paths 過濾：檢查不到一秒、零依賴，而「只改了 addresses.ts 卻沒改
# workflow」正是要抓的情況，過濾條件寫漏一個路徑就又回到看起來有 CI 的狀態。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addresses:
    name: workflow ↔ addresses.ts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # 先證明檢查本身會抓錯（fixture 含舊 exchange、錯鏈 oracle、零位址…），
      # 再用它檢查 repo。檢查器壞成「永遠通過」時第一步就會紅。
      - name: Self-test
        run: node --test scripts/check-addresses.test.mjs
      - name: Vercel ignored-build-step self-test
        run: node --test scripts/vercel-ignore-build.test.mjs
      # 平台位址全集的來源（git ls-files 的所有文字檔）、排除清單與具名白名單。
      - name: Platform address universe self-test
        run: node --test scripts/platform-addresses.test.mjs

      # 同一支也檢查租戶部署登記（frontend/src/contracts/deployments/*.json）：位址格式、
      # 重複的 JSON 鍵、同租戶不重複；專屬租戶登記裡的**每一個**位址都不得出現在平台位址全集
      # （repo 內所有被追蹤的文字檔裡出現過的位址＋退役清單）或其他租戶裡，唯一例外
      # 是顯式宣告共用、而且就是平台那一顆的結算代幣；帶 KEEPER_TENANT 的租戶 keeper workflow
      # 只能指向該租戶自己的合約（ADR-008）。鏈上的綁定與所有權由 tenant-verify.yml 驗證。
      - name: Check workflow addresses
        run: node scripts/check-addresses.mjs

  tenant-deploy:
    # 租戶部署設定（deploy/tenants/*.json）：不放秘密、角色分離、不與正式站或其他租戶
    # 共用專屬位址、前端白名單 ⊆ 金庫註冊資產；部署紀錄（*.deployed.json）只收廣播過的，
    # 而且前端部署登記必須與它逐欄位相同。只讀，不送交易。見 docs/TENANT_DEPLOYMENT.md。
    name: tenant deploy configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Self-test
        run: node --test scripts/check-tenant-deploy.test.mjs

      - name: Check tenant deploy configs
        run: node scripts/check-tenant-deploy.mjs

  keeper-trigger:
    name: keeper trigger worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: decide / tick tests
        run: node --test ops/keeper-trigger/keeper-trigger.test.mjs

  monitoring:
    # 鏈上監控設定（ops/monitoring/monitors.json）：位址 == frontend/src/contracts/**、
    # 事件存在於 ABI（pending-deploy 則存在於 Solidity 原始碼）、topic0／selector 正確、
    # 處置段落存在於 INCIDENT_RESPONSE.md、rules.md 未過期、設定目錄沒有秘密；active 事件規則的
    # topic0 存在於部署版 bytecode（離線 fixture ops/monitoring/deployed.json）、admin 事件都有規則、
    # 必要規則未被刪除或降級、每條規則的定義等於釘住的 sha256、參數在範圍內（MAX_BLOCK_RANGE ≤ 1000、
    # 不可等於關掉告警）、MUTE_KEYS 只用白名單、部署版裡的管理函式都有規則或理由、UUPS proxy 有實作 slot 規則。
    # deployed.json 是否仍是鏈上實況由每週的 monitoring-fixture.yml（唯讀連網）檢查。
    # 只讀、不連網、不部署 Worker。見 docs/ADR-009-monitoring.md。
    name: monitoring rules ↔ addresses.ts / ABI
    runs-on: ubuntu-latest
    # 檢查器自我測試含突變清單（每項複製一份 repo 跑檢查），本機約 2 分鐘。
    timeout-minutes: 10
    steps:
      # submodules：Timelock 規則（pending-deploy）的事件宣告在 OpenZeppelin 原始碼裡。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # 先證明檢查器會抓錯，再用它檢查 repo。
      - name: Checker self-test
        run: node --test scripts/check-monitoring.test.mjs
      - name: Engine / notify tests
        run: node --test ops/monitoring/monitor.test.mjs
      - name: Check monitoring config
        run: node scripts/check-monitoring.mjs

  release-status:
    # 發布狀態（docs/RELEASE_STATUS.md）：「已合併」不等於「已部署、鏈上＝原始碼」。這支 job
    # 不連網，只確認那份文件沒有過期或被手改——它必須是 docs/release-status.json 的渲染結果、
    # 位址等於 frontend/src/contracts/**、標成「鏈上＝原始碼」的元件原始碼沒有在產生之後被改、
    # 展示驗收引用的證據檔都存在、外洩地址名單讀得到。鏈上比對本身要以唯讀 RPC 在本機重跑
    # node scripts/check-deployment-status.mjs（見 docs/OWNER_ACTIONS.md 第 7 步）。
    # 同一個 job 也跑部署後 smoke test 的自我測試（腳本本身唯讀、不需要私鑰）。
    name: release status ↔ addresses.ts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # 先證明檢查器會抓錯（手改報告、位址變更、原始碼在「鏈上＝原始碼」之後被改…），再檢查 repo。
      - name: Self-test
        run: node --test scripts/check-deployment-status.test.mjs scripts/post-deploy-smoke.test.mjs

      - name: Check release status (offline)
        run: node scripts/check-deployment-status.mjs --offline

  workflow-guards:
    # 持有鏈上私鑰的 job 靠「私鑰只放 environment secret＋只有特定 job 綁那個 environment＋
    # admin 呼叫先經人工核准」保護，而這些都只是 workflow 檔裡的幾行 YAML。這支檢查把規則
    # 寫死：別的 job 綁了 keeper／settlement／admin-approval、admin-call 少了 needs: approve、
    # 三個守門 step 的內容（以 sha256 釘住）被改、出現 pull_request_target／workflow_run、
    # 持有私鑰的 workflow 多了觸發事件或 inputs、run 內插 inputs／github.event、用到私鑰的
    # job 沒綁 environment，都會紅。規則與理由見 scripts/check-workflow-guards.mjs 開頭。
    name: workflow guards (environment / secrets / triggers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # 唯一的依賴是 YAML 解析器。版本固定在 scripts/package.json（yaml 2.9.1，與
      # agent/package-lock.json 同一個版本），`npm ci` 會用 scripts/package-lock.json 的
      # sha512 integrity 驗證下載內容；--ignore-scripts 不執行任何安裝腳本。這個 job 沒有
      # secrets、token 只有 contents: read，checkout 也不留憑證。
      - name: Install pinned YAML parser
        working-directory: scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 先證明檢查本身會抓錯（反例 fixture 與「改一行就繞過」的情境），再檢查 repo。
      - name: Self-test
        run: node --test scripts/check-workflow-guards.test.mjs

      # 租戶 keeper 類別：範本＋產生器＋位址讀取腳本；反例（多一個觸發、改一行 step、
      # environment 不符、id 未登記、借用平台的 keeper environment），以及 check-addresses 與
      # 這支檢查對同一份產生出來的租戶 workflow 同時通過。
      - name: Tenant keeper self-test
        run: node --test scripts/tenant-keeper.test.mjs

      - name: Check workflow guards
        run: node scripts/check-workflow-guards.mjs

  actionlint:
    # workflow 語法、運算式型別、`run:` 內的 shellcheck（ubuntu-latest 內建 shellcheck，
    # actionlint 在 PATH 上找得到就會用）。守門檢查只看安全規則，打錯字或運算式錯誤要靠這支。
    # 不用 marketplace action、不用 `go install`：直接下載固定版本的 release 檔並驗 sha256
    # （值與 release 頁的 actionlint_1.7.12_checksums.txt、GitHub API 的 asset digest 相同）。
    # 這個 pin 不在 Dependabot 範圍內，升級時要手動改 VERSION 與 SHA256。
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint (sha256 verified)
        env:
          VERSION: '1.7.12'
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Run actionlint
        run: |
          set -euo pipefail
          shellcheck --version   # runner 映像內建；不存在就失敗，免得 shellcheck 檢查無聲消失
          "$RUNNER_TEMP/actionlint" -color

      # 租戶 keeper 範本不在 .github/workflows 裡（還沒有任何租戶時就沒有產生出來的檔案），
      # 以探測用 id 代入後同樣跑一次 actionlint，範本本身的語法與 shellcheck 問題才擋得到。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run actionlint on the tenant keeper template
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tenant-keeper/.github/workflows"
          probe="$RUNNER_TEMP/tenant-keeper/.github/workflows/keeper-zz-template-probe.yml"
          node scripts/gen-tenant-keeper.mjs --template-probe > "$probe"
          "$RUNNER_TEMP/actionlint" -color "$probe"
