name: Admin — Base Sepolia owner call

# Runs an owner-only call on any Base Sepolia contract using the keeper key
# stored in repo secrets. Manual trigger only.
#
# WARNING — this workflow currently cannot perform owner calls on Base Sepolia.
# The comment here used to claim KEEPER_PRIVATE_KEY "is the deployer/owner of the
# core contracts". That stopped being true on 2026-07-27, when the role
# separation moved the secret to the dedicated keeper key
# 0x540aECD3…ef17. On Base Sepolia that key holds 0 ETH and owns nothing —
# MockOracle.owner() is still the deployer 0xE80A8136…Eb93. Every call sent from
# here fails at gas estimation with "gas required exceeds allowance (0)".
#
# Fix the ownership and funding first (docs/RUNBOOK_KEEPER.md), or send the
# transaction locally with the deployer key. Leaving the old comment in place
# would send the next reader down a path that cannot work.
# Examples:
#   setMaxPriceAge(uint256)   args: 21600            target: PerpetualExchange
#   setExecutionFee(uint256)  args: 100000000000000  target: PerpetualExchange
#   mint(address,uint256)     args: 0xRecipient 1000000000000000000000000
#                             target: PepeToken (owner-only)
#
# NOTE: anyone with write access to this repo can effectively act as the
# contract owner through this workflow — do not accept external changes to
# workflow files.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target contract address (default: PerpetualExchange)"
        required: true
        default: "0xEf75ECA6514cE96B18382E921aC6190a0cF8c072"
      function:
        description: "Function signature, e.g. setMaxPriceAge(uint256) or mint(address,uint256)"
        required: true
        default: "setMaxPriceAge(uint256)"
      args:
        description: "Space-separated arguments, e.g. '21600' or '0xRecipient 1000000000000000000000'"
        required: true
        default: "21600"

jobs:
  admin-call:
    runs-on: ubuntu-latest
    env:
      TARGET:   ${{ github.event.inputs.target }}
      RPC_URL:  ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      PK:       ${{ secrets.KEEPER_PRIVATE_KEY }}
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Guard — secrets present
        run: |
          if [ -z "$RPC_URL" ] || [ -z "$PK" ]; then
            echo "::error::BASE_SEPOLIA_RPC_URL / KEEPER_PRIVATE_KEY secrets not set"
            exit 1
          fi

      - name: Send owner transaction
        run: |
          set -euo pipefail
          echo "Calling ${{ github.event.inputs.function }} on $TARGET with args: ${{ github.event.inputs.args }}"
          cast send "$TARGET" \
            "${{ github.event.inputs.function }}" ${{ github.event.inputs.args }} \
            --rpc-url "$RPC_URL" \
            --private-key "$PK"
