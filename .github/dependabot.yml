# Dependabot 版本更新設定。
#
# 目標是「有人會看的 PR」，不是「PR 數量」：被無視的更新 PR 跟沒有一樣，還會把真正
# 的安全更新淹沒。所以：
#   • 一律每週、固定週一早上（台北時間），集中在同一個時段處理。
#   • minor/patch 合併成一個 group PR；major 才單獨開（需要人讀 changelog）。
#   • open-pull-requests-limit 只限制「版本更新」PR。**安全更新（Dependabot security
#     updates）不受這個上限影響**，需在 repo Settings → Code security 另外開啟。
#
# 注意：Dependabot 沒有獨立的 `yarn` ecosystem —— `npm` 會依目錄裡的 lockfile
# 自動判斷 npm（agent/package-lock.json）或 yarn（frontend/yarn.lock）。
version: 2
updates:
  # GitHub Actions：所有 action 都 pin 在 commit SHA（見各 workflow 註解），Dependabot
  # 會同時更新 SHA 與行尾的版本註解。持有 KEEPER_PRIVATE_KEY 的 job 依賴這些 action，
  # 所以這是最該跟上的一類，但一週一個 group PR 就夠。
  # 注意：admin-base-sepolia.yml、base-sepolia-keeper.yml、price-keeper.yml、
  # x402-settlement-worker.yml 的整份內容被 scripts/check-workflow-guards.mjs 的
  # PINNED_WORKFLOWS 釘住，這裡升級它們的 SHA 時 workflow-guards 會紅——刻意的：人工
  # 審過新 SHA 後，在同一個 PR 執行 `node scripts/check-workflow-guards.mjs --print-pins`
  # 更新雜湊（見 ops/keeper-trigger/README.md「workflow 守門的靜態檢查」）。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # agent/：npm workspaces（shared / signal-api / mcp-server / demo-agent）共用
  # 一份 package-lock.json，所以只設根目錄一個 entry。keeper 與 x402 結算 worker
  # 都在這裡，major 升級（ethers、typescript…）必須人工看過，所以 major 單獨開、
  # 全部 PR 上限 3。
  - package-ecosystem: npm
    directory: /agent
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      agent-minor-patch:
        update-types: [minor, patch]
    # x402-hono 刻意留在 0.5.x（2026-10-02 評估 #222，0.5.3 → 1.2.0）：
    #   • 預設 X402_PROTOCOL=v1 的 402 回應必須與遷移前逐位元相同
    #     （signal-api/src/x402DefaultGolden.test.ts）。1.x 只要請求帶 X-Forwarded-Proto
    #     與 X-Forwarded-Host 就改用它們組 resource（Vercel 會帶），不再走 vercel-entry.ts
    #     的 https 修正路徑；壞 X-PAYMENT／結算失敗的 402 error 也從 Error 物件（序列化
    #     成 {}）改成字串；瀏覽器拿到的 paywall HTML 換成新模板。
    #   • 1.x 自己接住 facilitator /verify 丟出的例外並回 402，app.ts 的
    #     classifyFacilitatorFailure（503／429 分類）就接不到，facilitator 故障會變成
    #     「請重新付款」。
    #   • 1.x 依賴 x402 ^1，與 signal-api 直接使用的 x402 0.5.3 型別不相容（typecheck 紅）。
    # 0.x 的 minor 一樣是破壞性升級（2026-10-04 評估 #234，0.5.3 → 0.8.0）：0.8.0 已含上面
    # 前兩點的全部改動（X-Forwarded resource、error 改字串、paywall 改用 x402/paywall、
    # 自己接住 /verify 例外），且依賴 x402 ^0.8，app.ts 的 computeRoutePatterns(paidRoutes())
    # typecheck 紅；實測 x402DefaultGolden 與 facilitatorErrors（503 → 402）也紅。所以 minor
    # 也擋，只放行 0.5.x 的 patch。
    #
    # x402 本體同理留在 0.5.x（2026-10-04 評估 #235，0.5.3 → 1.2.0）：
    #   • signal-api 直接 import x402/shared 的 computeRoutePatterns／findMatchingRoute，
    #     用意是「是否為付費路由」的判斷與付費牆（x402-hono 0.5.3 內部的 x402）**同一份程式**。
    #     x402-hono 0.5.3 要的是 x402 ^0.5.3，單升 x402 會讓 npm 裝兩份：付費牆仍用 0.5.3，
    #     app.ts 用 1.2.0，兩邊就不再同源。1.2.0 的 findMatchingRoute 也確實改了行為：
    #     decodeURIComponent 失敗時不再回「不匹配」，改用原始路徑繼續比對。
    #   • v1 golden 與 facilitator 錯誤分類目前不受影響（402 與 /verify 都在 x402-hono
    #     內部的 0.5.3 處理），但那是兩份並存的結果，不是相容。
    #   • 1.2.0 讓 Vercel bundle 多打進 40 個 @solana/*、@solana-program/* 套件，對 v1 路徑沒有任何好處。
    #   • x402 的 0.x minor（例如 0.8）同樣會和 x402-hono 0.5.3 分家，所以 minor 也擋。
    # x402 與 x402-hono 只能一起動；v1 付款路徑的後續方向是 X402_PROTOCOL=v2（@x402/*，
    # ADR-010），不是升這兩個 v1 套件。
    # 兩者的 patch（0.5.x）仍照常進 agent-minor-patch group。
    # x402-fetch（demo-agent 的 v1 付款 client）屬同一家族，0.x minor／1.x 同樣會把 x402 分成兩份，比照擋下。
    ignore:
      - dependency-name: "x402-hono"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "x402"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "x402-fetch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(agent-deps)"

  # frontend/：yarn（yarn.lock）。前端依賴樹大、上游發版頻繁（wagmi / viem /
  # walletconnect），不設 group 會一週十幾個 PR。minor/patch 合一個 PR，major 單獨開，
  # 全部 PR 上限 3。
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(frontend-deps)"

  # scripts/：npm（scripts/package-lock.json）。目前只有一個依賴——`yaml`，
  # check-workflow-guards.mjs 用它解析 workflow（consistency.yml 的 workflow-guards job）。
  # 版本是固定的（不帶 ^），由 lockfile 的 integrity 驗證；升級靠這裡每週開的 PR。
  # 它與 agent/package-lock.json 的 yaml 刻意同版本，升級時兩邊一起看。上限 2。
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 2
    groups:
      scripts-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(scripts-deps)"

  # contracts/lib/：forge-std、openzeppelin-contracts(-upgradeable) 是 git submodule，
  # 合約的安全修補（OZ advisory）只會從這裡進來。每週檢查一次；submodule 升級會改
  # 已部署合約的編譯結果，必須人工讀 changelog 並跑 contracts-ci，所以上限 2、不 group。
  #
  # OpenZeppelin 兩個 submodule 刻意 ignore，改為人工依 release tag 升級（複審 Medium）：
  #   • gitsubmodule 更新追的是預設分支的最新 commit，不是 release tag —— 會把未發版、
  #     未經 audit 的 OZ master 程式碼帶進合約。
  #   • AssetVaultV2 是 UUPS proxy，OZ upgradeable 的 storage layout 變動會毀掉既有部署；
  #     升級前必須跑 storage layout 比對，不能交給機器人。
  #   • OZ 的安全公告（GHSA）仍會觸發 Dependabot alerts；收到後人工 checkout 對應 tag。
  # forge-std 只用在測試，不進部署的 bytecode，保留自動更新。
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "contracts/lib/openzeppelin-contracts"
      - dependency-name: "contracts/lib/openzeppelin-contracts-upgradeable"
    commit-message:
      prefix: "chore(contracts-deps)"
