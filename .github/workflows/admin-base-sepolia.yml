name: Admin — Base Sepolia owner call

# Runs an owner-only setter on the Base Sepolia PerpetualExchange using the
# keeper key stored in repo secrets (which is the contract owner). Manual
# trigger only. Example: set maxPriceAge to 21600 (6h).
#
# NOTE: anyone with write access to this repo can effectively act as the
# contract owner through this workflow — do not accept external changes to
# workflow files.

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Setter signature, e.g. setMaxPriceAge(uint256)"
        required: true
        default: "setMaxPriceAge(uint256)"
      value:
        description: "Single uint256 argument, e.g. 21600 for 6h"
        required: true
        default: "21600"

jobs:
  admin-call:
    runs-on: ubuntu-latest
    env:
      EXCHANGE: "0xEf75ECA6514cE96B18382E921aC6190a0cF8c072"
      RPC_URL:  ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      PK:       ${{ secrets.KEEPER_PRIVATE_KEY }}
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Guard — secrets present
        run: |
          if [ -z "$RPC_URL" ] || [ -z "$PK" ]; then
            echo "::error::BASE_SEPOLIA_RPC_URL / KEEPER_PRIVATE_KEY secrets not set"
            exit 1
          fi

      - name: Send owner transaction
        run: |
          set -euo pipefail
          echo "Calling ${{ github.event.inputs.function }} with ${{ github.event.inputs.value }}"
          cast send "$EXCHANGE" \
            "${{ github.event.inputs.function }}" "${{ github.event.inputs.value }}" \
            --rpc-url "$RPC_URL" \
            --private-key "$PK"

      - name: Verify (read back common getters)
        run: |
          echo "maxPriceAge: $(cast call "$EXCHANGE" 'maxPriceAge()(uint256)' --rpc-url "$RPC_URL")"
