# 測試用反例 fixture：引用鏈上私鑰卻沒有綁（或綁錯）environment，以及看不出名稱的 secrets 存取。
name: fixture unbound secret
on:
  push:
jobs:
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - env:
          PK: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: echo "repo 層級的 secret 還在時，這個 job 拿得到私鑰"
  lower-case-inline:
    runs-on: ubuntu-latest
    steps:
      - run: cast send --private-key "${{ secrets.fee_settlement_private_key }}"
  index-form:
    runs-on: ubuntu-latest
    steps:
      - env:
          PK: ${{ secrets[ 'KEEPER_PRIVATE_KEY' ] }}
        run: echo index
  wrong-environment:
    runs-on: ubuntu-latest
    environment: admin-approval
    steps:
      - env:
          PK: ${{ secrets.FEE_SETTLEMENT_PRIVATE_KEY }}
        run: echo wrong
  dump-all:
    runs-on: ubuntu-latest
    steps:
      - env:
          ALL: ${{ toJSON(secrets) }}
        run: echo dump
  computed:
    runs-on: ubuntu-latest
    steps:
      - env:
          PK: ${{ secrets[format('{0}_PRIVATE_KEY', 'KEEPER')] }}
        run: echo computed
  inherit:
    uses: ./.github/workflows/reusable.yml
    secrets: inherit
