[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# ADR-008：DeployTenant／VerifyTenant 只能「讀」租戶部署設定所在的 deploy/tenants/；
# 部署紀錄只寫進 git-ignored 的 cache/tenants/（複製到 deploy/tenants/ 是人工步驟）。
# 除此之外腳本與測試對檔案系統沒有任何權限。
fs_permissions = [
    { access = "read", path = "../deploy/tenants" },
    { access = "read-write", path = "./cache/tenants" },
    # VerifyTenant 比對鏈上 runtime bytecode 時，從編譯產物讀 immutable／library 的位置
    # （deployedBytecode.immutableReferences／linkReferences）。只讀、只限 out/。
    { access = "read", path = "./out" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
anvil        = "http://localhost:8545"
sepolia      = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
sepolia      = { key = "${ETHERSCAN_API_KEY}" }
# BaseScan (Base Sepolia, chainId 84532). Key from env, never committed.
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
