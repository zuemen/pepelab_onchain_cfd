# 自我測試用 fixture：刻意寫錯的位址。check-addresses.mjs 對這個目錄必須以非零結束。
# 形狀照抄 2026-09-29 以前的 base-sepolia-keeper.yml（#178 修正前）。
# 註解裡的位址不檢查：0xEf75ECA6514cE96B18382E921aC6190a0cF8c072
name: Fixture — stale addresses

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target contract address (default: PerpetualExchange)"
        required: true
        default: "0xEf75ECA6514cE96B18382E921aC6190a0cF8c072"

permissions:
  contents: read

jobs:
  keep:
    runs-on: ubuntu-latest
    env:
      KEEPER_CHAIN: base-sepolia
      # 錯 1：舊 exchange（#178 修掉的那顆）
      EXCHANGE: "0xEf75ECA6514cE96B18382E921aC6190a0cF8c072"
      # 錯 2：把 Sepolia 的 MockOracle 貼進 Base Sepolia 的 job（位址本身「認得」，但鏈錯了）
      KEEPER_ORACLE_ADDRESS: "0x17CA20A37Cf04F2f589B2573EC95f1411D29d958"
      # 對：現行 Base Sepolia GuardedOracle
      KEEPER_GUARDED_ORACLE: "0x8E9e59BE9589Ad88EC14F3ef6bdcc43E8B76f842"
      # 錯 6：X402_FEE_ROUTER 填成 MockOracle（位址「認得」，但角色錯了）
      X402_FEE_ROUTER: "0xeD90c4F3B48213888870C1FC8486921Cb0990Aa3"
    steps:
      - run: |
          # 錯 3：寫死在 run 腳本裡、前端設定不認得的位址
          cast call 0x4E7cC1B79B72ab72531a6C790e14304370f70764 "exchange()(address)"
      - run: |
          # 錯 7：在 Base Sepolia 的 job 裡對 Sepolia exchange 下 cast send（位址認得、鏈錯了）
          cast send 0x0c6459d38617E60017bDc4ed69ec26137DA5c32b "settleFunding(bytes32)" 0x00
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 錯 8：with: 帶 Sepolia 位址（Sepolia GuardedOracle）
          address: "0x32A19D04ef2ca5A7DA02Df39419729fA745749A1"

  sepolia:
    runs-on: ubuntu-latest
    env:
      KEEPER_CHAIN: sepolia
      # 對：Sepolia 的 GuardedOracle 依鏈解析自 V2_STACK[11155111]，不需例外
      KEEPER_GUARDED_ORACLE: "0x32A19D04ef2ca5A7DA02Df39419729fA745749A1"
      # 錯 4：零位址
      KEEPER_VAULT_ADDRESS: "0x0000000000000000000000000000000000000000"
    steps:
      - run: echo ok
