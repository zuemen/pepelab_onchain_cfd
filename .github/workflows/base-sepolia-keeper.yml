name: Base Sepolia Keeper

# 用 agent/keeper/run.ts（單一實作、有單元測試）刷新 MockOracle，並 crank
# settleFunding。
#
# 2026-08-06 之前這個 workflow 用一段行內 bash：每個 cast send 後面掛 `|| echo`，
# 於是 keeper 錢包餘額為 0、每筆交易在 gas estimation 就失敗的情況下，仍然連續
# 10 天回報 success，而鏈上價格停在 9.5–44 天前。現在寫入 0 筆會讓 job 失敗。
#
# 2026-08-06 稽核（docs/audit/AUDIT_2026-08-06.md §六）後補上：
#   - `permissions:` 最小化（本 job 只讀 repo，不寫任何 GitHub 資源）
#   - `concurrency:` 與 admin-base-sepolia.yml **共用同一個 group**。兩者都用
#     KEEPER_PRIVATE_KEY 對同一條鏈送交易，並行會撞 nonce。cancel-in-progress
#     必須是 false —— 取消一個正在送交易的 job 會留下不確定的鏈上狀態。
#   - `timeout-minutes:` 讓卡住的 RPC 不會佔住 runner 六小時。
#   - settleFunding 改成「先讀鏈上 lastFundingUpdateAt 判斷是否真的還沒到時間」，
#     不再把所有失敗一律說成「interval 未到」。
#   - 部分失敗（>30% 資產寫不進去）也會讓 job 失敗，不再只是 warning。
#
# Secrets:
#   BASE_SEPOLIA_RPC_URL   Base Sepolia RPC endpoint
#   KEEPER_PRIVATE_KEY     必須是 MockOracle 的 owner，且在 Base Sepolia 上有測試 ETH
on:
  schedule:
    # 名目 15 分鐘。GitHub 排程是 best-effort，實測真實間隔為 68–169 分鐘，
    # 所以下游的 maxPriceAge 必須以「約 2 小時」而不是 15 分鐘來設定。
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # 複審 H2 (c)：價格熔斷時立刻開 issue／留言／恢復後關閉（keeper/alert-run.ts）。
  # 只加 issues，不給 contents: write / actions；checkout 用 persist-credentials: false，
  # GITHUB_TOKEN 只在告警 step 經 GH_TOKEN 取得，持有私鑰的喂價 step 拿不到。
  issues: write

# 與 admin-base-sepolia.yml 共用：同一把金鑰 + 同一條鏈 = 同一個 nonce 序列。
concurrency:
  group: keeper-key-base-sepolia
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEEPER_CHAIN: base-sepolia
      KEEPER_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
      KEEPER_ORACLE_ADDRESS: "0xeD90c4F3B48213888870C1FC8486921Cb0990Aa3"
      EXCHANGE: "0x827eA0c62a32e995927101259042F8A27D99124D"
      # 部分失敗容忍度：失敗筆數 / 有價可寫筆數 超過這個百分比就讓 job 失敗。
      MAX_FAIL_PCT: "30"
      # AggregatorOracleAdapter（Chainlink + Pyth）。Pyth 在 Base Sepolia 是活的：
      # 2026-08-06 實測 sBTC $64,484.07、sETH $1,894.91，與外部 API 一致。
      # 設定之後 sBTC/sETH 改讀鏈上去中心化預言機，其餘資產（測試網沒有 feed）
      # 自動退回 Yahoo。Chainlink 對這些 assetId 沒有 feed，聚合器會退化成單走 Pyth。
      #
      # 這是受信任的中繼，不是無信任的整合：keeper 的金鑰仍可寫任何值。它拿掉的是
      # 對中心化交易所 API 的依賴，不是對 keeper 的依賴。
      KEEPER_RELAY_SOURCE: "0x8215158642350a3f329aB9597186d21f957A813D"
      # #129 硬化版 V2 stack（2026-09-10 上鏈）。之前沒設，GuardedOracle 自 9/10 起
      # 沒人餵價；vault 的 maxPriceAge 是 30 天，2026-10-10 03:17 UTC 就會讓
      # mint／redeem 全面 StalePrice。keeper key 已有 GuardedOracle 的 KEEPER_ROLE
      # （2026-09-29 鏈上 hasRole 核對）；observeReserve() 是 permissionless。
      KEEPER_GUARDED_ORACLE: "0x8E9e59BE9589Ad88EC14F3ef6bdcc43E8B76f842"
      KEEPER_VAULT_ADDRESS: "0x916D7Fc399d9afd23BAa113E2c2Cc601341ff10a"
    steps:
      # 第三方 action 一律 pin 到 commit SHA：tag 是可移動的，供應鏈攻擊只要把
      # tag 重指到惡意 commit，這個持有 KEEPER_PRIVATE_KEY 的 job 就會執行它。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fail fast when secrets are missing
        run: |
          set -euo pipefail
          if [ -z "${KEEPER_RPC_URL:-}" ] || [ -z "${KEEPER_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 BASE_SEPOLIA_RPC_URL 或 KEEPER_PRIVATE_KEY —— 喂價無法運作。"
            exit 1
          fi

      # 見 price-keeper.yml 的同名步驟：keeper 燒完 gas 時，失敗訊息不會提到餘額，
      # 所以先自己講清楚。Base 的 gas 便宜得多，門檻相應調低。
      - name: Check keeper gas balance
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Warn before the tank runs dry
        env:
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          PK: ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ADDR=$(cast wallet address --private-key "$PK")
          BAL=$(cast balance "$ADDR" --rpc-url "${RPC_URL:-https://sepolia.base.org}")
          ETH=$(cast from-wei "$BAL")
          echo "keeper $ADDR 餘額 $ETH ETH"
          if [ "$(echo "$ETH < 0.02" | bc -l)" = "1" ]; then
            echo "::warning::keeper 餘額只剩 $ETH ETH。請補 gas，否則喂價會停。"
          fi
          if [ "$(echo "$ETH < 0.002" | bc -l)" = "1" ]; then
            echo "::error::keeper 餘額 $ETH ETH，不足以送出交易。這是喂價失敗的原因，不是 RPC 或程式問題。"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      # npm ci 而非 npm install：ci 只安裝 lockfile 裡的版本，install 會在
      # lockfile 過期時自行改寫它。喂價 job 不該有「今天跟昨天裝到不同版本」的自由度。
      - name: Install agent deps
        working-directory: agent
        run: npm ci --no-audit --no-fund

      # agent 的單元測試跑在 .github/workflows/agent-ci.yml，刻意不掛在這裡：
      # 喂價是 liveness 關鍵路徑，用單元測試當它的前置條件，等於讓一支壞掉的
      # 測試把線上價格一起停掉。
      - name: Refresh prices
        id: refresh
        working-directory: agent
        env:
          # 熔斷報告（給告警 step）與拒寫清單（給 funding crank）。
          KEEPER_REPORT_PATH: ${{ runner.temp }}/keeper-report.json
          KEEPER_REFUSED_PATH: ${{ runner.temp }}/keeper-refused.txt
        run: |
          set -uo pipefail
          npx tsx keeper/run.ts 2>&1 | tee /tmp/keeper.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::keeper/run.ts 以非零狀態結束（exit $STATUS）。"
            exit "$STATUS"
          fi

          # run.ts 只在「一筆都沒寫成功」時才 exit 1。部分失敗它只印 warning，
          # 於是 11 個資產壞掉 7 個仍然是綠的。這裡用它印出的摘要行補上門檻。
          # 只錨定真正要用的兩個欄位，中間允許 run.ts 之後再加欄位（它已經加過
          # rejected= 與 clamped=，把原本寫死整行的 pattern 打掉了）。這個門檻的
          # 目的是量測失敗率，不是驗證輸出格式；綁太死只會讓它在無關的改動下誤報。
          SUMMARY=$(grep -E '^available=[0-9]+ .*failed=[0-9]+$' /tmp/keeper.log | tail -1 || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::找不到 keeper 摘要行 —— 輸出格式已改變，這個門檻已失效，請修正 workflow。"
            exit 1
          fi
          AVAILABLE=$(echo "$SUMMARY" | sed -n 's/.*available=\([0-9]*\).*/\1/p')
          FAILED=$(echo "$SUMMARY" | sed -n 's/.*failed=\([0-9]*\).*/\1/p')
          echo "keeper 摘要：$SUMMARY"
          if [ "$AVAILABLE" -gt 0 ] && [ "$FAILED" -gt 0 ]; then
            PCT=$(( FAILED * 100 / AVAILABLE ))
            echo "寫入失敗率 ${PCT}%（門檻 ${MAX_FAIL_PCT}%）"
            if [ "$PCT" -gt "${MAX_FAIL_PCT}" ]; then
              echo "::error::${AVAILABLE} 個資產中有 ${FAILED} 個寫入失敗（${PCT}% > ${MAX_FAIL_PCT}%）。喂價已部分失效，不要當成成功。"
              exit 1
            fi
          fi

      # 複審 H2 (c)：熔斷時同一個 run 內立刻開 issue（已開著就留言，恢復後關閉）。
      # 喂價 step 成功或失敗都要跑；報告不存在（run.ts 提早中止）時 alert-run 不動 issue。
      # 告警本身失敗只發 ::warning::，不影響 job 紅綠。
      - name: Alert on price circuit breaker
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        working-directory: agent
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_REPORT_PATH: ${{ runner.temp }}/keeper-report.json
          ALERT_TITLE: "[keeper] Base Sepolia 價格熔斷"
        run: npx tsx keeper/alert-run.ts

      # 喂價步驟部分失敗（例如某一個資產偏離過大被拒寫）時仍要 crank funding：
      # 兩件事互相獨立，不能讓一個資產的喂價問題連帶停掉整條 funding 結算。
      - name: Install Foundry
        if: ${{ !cancelled() }}
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      # 舊版把每個失敗都說成「funding interval 未到」，於是「keeper 沒油」「不是
      # owner」「RPC 掛了」全部長得跟正常狀態一模一樣。現在先讀鏈上的
      # lastFundingUpdateAt + FUNDING_INTERVAL 判斷是否真的還沒到時間；
      # 到時間了還送不出去，就是真的壞了。
      #
      # FUNDING_INTERVAL 從鏈上讀而不是寫死：目標是 #129 的 exchange（8 小時）；
      # 2026-09-29 之前這裡仍指向兩次 cutover 前的舊 exchange 0xEf75…（300 秒）。
      - name: Crank settleFunding
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          INTERVAL=$(cast call "$EXCHANGE" "FUNDING_INTERVAL()(uint256)" --rpc-url "$KEEPER_RPC_URL" | awk '{print $1}')
          if ! [ "${INTERVAL:-}" -gt 0 ] 2>/dev/null; then
            echo "::error::讀不到 FUNDING_INTERVAL —— RPC 或 EXCHANGE 位址有問題。"
            exit 1
          fi
          NOW=$(date -u +%s)
          echo "FUNDING_INTERVAL=${INTERVAL}s  now=${NOW}"

          # nonce 自己算，不要每一筆都去問 RPC。`cast send` 會在交易被挖出來之前
          # 就返回，於是下一筆拿到的 pending nonce 還是同一個 → 第二筆之後全部
          # 「replacement transaction underpriced」。實測就是這樣掛的：sBTC 成功、
          # sETH 與 sTSLA 直接撞。失敗時不遞增，因為那個 nonce 沒有被消耗。
          KEEPER_ADDR=$(cast wallet address --private-key "$KEEPER_PRIVATE_KEY")
          # --block pending（窄複審 6）：喂價 step 若留下還沒上鏈的交易，latest 的 nonce 會
          # 撞上它；pending 會把 mempool 裡屬於這把金鑰的交易算進去。
          NONCE=$(cast nonce "$KEEPER_ADDR" --block pending --rpc-url "$KEEPER_RPC_URL")
          echo "keeper=${KEEPER_ADDR} 起始 nonce=${NONCE}"

          # 複審 Medium：被熔斷拒寫的資產，價格是已知錯誤的舊值 —— 不以它結算 funding。
          # 清單由 keeper/run.ts 寫出（一行一個 symbol）；檔案不存在代表喂價 step 沒跑到
          # 寫報告那一步，無從得知哪些資產可信，保守起見全部跳過。
          REFUSED_FILE="${RUNNER_TEMP}/keeper-refused.txt"
          if [ ! -f "$REFUSED_FILE" ]; then
            echo "::warning::找不到 $REFUSED_FILE（喂價 step 未完成），本輪不 crank funding。"
            exit 0
          fi

          FAILURES=0
          for SYM in sBTC sETH sAAPL sTSLA; do
            if grep -qx "$SYM" "$REFUSED_FILE"; then
              echo "::warning::$SYM: 本輪價格被熔斷拒寫，跳過 settleFunding（不以錯誤舊價結算）。"
              continue
            fi
            KEY=$(cast keccak "$SYM")

            LAST=$(cast call "$EXCHANGE" "lastFundingUpdateAt(bytes32)(uint256)" "$KEY" \
                     --rpc-url "$KEEPER_RPC_URL" 2>/dev/null | awk '{print $1}')
            if ! [ "${LAST:-}" -ge 0 ] 2>/dev/null; then
              echo "::error::$SYM: 讀不到 lastFundingUpdateAt —— 這是呼叫失敗，不是「時間未到」。"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            DUE=$((LAST + INTERVAL))
            if [ "$NOW" -lt "$DUE" ]; then
              echo "$SYM: funding interval 尚未到期（還有 $((DUE - NOW))s），略過。"
              continue
            fi

            # 到期了，這一筆就應該會成功。失敗＝真的有問題，把 revert 原文印出來。
            if OUT=$(cast send "$EXCHANGE" "settleFunding(bytes32)" "$KEY" \
                       --rpc-url "$KEEPER_RPC_URL" --private-key "$KEEPER_PRIVATE_KEY" \
                       --nonce "$NONCE" 2>&1); then
              echo "$SYM: funding settled (nonce ${NONCE})"
              NONCE=$((NONCE + 1))
            else
              echo "::error::$SYM: settleFunding 已到期卻失敗 —— $(echo "$OUT" | tr '\n' ' ' | cut -c1-300)"
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::settleFunding 有 ${FAILURES} 個資產失敗。"
            exit 1
          fi
