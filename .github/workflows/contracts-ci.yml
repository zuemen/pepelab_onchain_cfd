name: Contracts CI

# Runs the Foundry suite on every push and PR. Until now these 396 tests only
# ever ran on developers' machines, so a regression could reach main unnoticed —
# which is also the first thing an institutional customer's technical due
# diligence asks about.
on:
  push:
    # 這個 repo 的預設分支是 master。綁在 main 的時候 push trigger 從未觸發過，
    # 只有 pull_request 會跑 —— 又一個「看起來有 CI，實際上沒跑」的例子。
    branches: [master]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

  slither:
    name: slither static analysis
    runs-on: ubuntu-latest
    # Not a substitute for a third-party audit — it catches a known catalogue of
    # patterns, nothing more. It is the part of audit readiness that can be
    # automated, and it runs on every change instead of once.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: crytic/slither-action@v0.4.0
        id: slither
        continue-on-error: true       # reporting first; tighten once triaged
        with:
          target: contracts/
          slither-args: --exclude-dependencies --exclude-informational
          fail-on: none

  gas:
    name: gas snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Writes .gas-snapshot if absent, otherwise fails when gas moves beyond
      # tolerance. Informational for now — flip continue-on-error off once the
      # snapshot is committed and stable.
      - name: Gas snapshot
        run: forge snapshot --check || forge snapshot
        continue-on-error: true
