# 測試用反例 fixture：workflow 層級的 env 引用私鑰 → 每個 job 都拿得到，每個 job 都要算。
name: fixture top-level secret
on:
  push:
env:
  KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - run: echo first
  second:
    runs-on: ubuntu-latest
    steps:
      - run: echo second
