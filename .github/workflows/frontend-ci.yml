name: Frontend CI

# Type-check, lint, and build the Vite app on every push and PR touching it.
# The build runs tsc + eslint + vite, so a type error or lint error fails here
# rather than at deploy time.
on:
  push:
    # 這個 repo 的預設分支是 master。綁在 main 的時候 push trigger 從未觸發過，
    # 只有 pull_request 會跑 —— 又一個「看起來有 CI，實際上沒跑」的例子。
    branches: [master]
    paths:
      - 'frontend/**'
      # 匿名審查護欄（frontend/src/anonymity.test.ts）也掃這三處，改到它們時同樣要跑。
      - 'web/**'
      - 'README.md'
      - 'docs/**'
      # 前端的市場時段規則是 keeper 的複製，一致性測試（src/lib/pepefi/marketHours.keeper.test.ts）
      # 直接載入這三個檔；改 keeper 的時段規則時也要跑到它。
      - 'agent/keeper/market.ts'
      - 'agent/keeper/operator.ts'
      - 'agent/keeper/marketMode.ts'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      # 匿名審查護欄（frontend/src/anonymity.test.ts）也掃這三處，改到它們時同樣要跑。
      - 'web/**'
      - 'README.md'
      - 'docs/**'
      # 前端的市場時段規則是 keeper 的複製，一致性測試（src/lib/pepefi/marketHours.keeper.test.ts）
      # 直接載入這三個檔；改 keeper 的時段規則時也要跑到它。
      - 'agent/keeper/market.ts'
      - 'agent/keeper/operator.ts'
      - 'agent/keeper/marketMode.ts'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: yarn build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # frontend is yarn-only; --frozen-lockfile makes an out-of-date lockfile
      # a CI failure rather than a silent resolution difference.
      # package-lock.json 已刪除並加進 .gitignore —— 它從未被任何流程驗證過，
      # 留著只會是第二個互相矛盾的真相來源（稽核 §六）。
      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # 白標：示範租戶也要能 build。租戶設定驗證不過（schema、資產白名單、id）會讓
      # vite build 失敗，所以這一步同時守住 frontend/src/tenant/tenants/demo-bank.json。
      # 正式站（default 租戶）的 build 是上面那一步。直接跑 vite build：tsc 與租戶無關，
      # 上一步已經跑過，不必重跑。
      - name: Build (demo-bank tenant)
        run: npx vite build
        env:
          VITE_TENANT: demo-bank

      - name: Test
        run: yarn test
