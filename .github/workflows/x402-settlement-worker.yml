name: x402 Settlement Worker

# 優先序 1（x402 硬化）：把 70/20/10 分潤的上鏈交易移出付費請求路徑。
# agent/signal-api/src/app.ts 的兩個付費端點現在只把 (trader, feeUsd, timestamp)
# 推進 Upstash 佇列就回應；真正送 FeeRouter.routeExternalRevenue 的地方只剩這支
# workflow 觸發的 agent/signal-api/src/settlement-worker.ts。
#
# 為什麼這樣就讓跨實例 nonce 衝突在設計上消失：以前是「每個 Vercel 實例各自在
# 請求路徑裡送交易，共用同一把 FEE_SETTLEMENT_PRIVATE_KEY」——事情發生在無法控制
# 並發數的地方。現在送交易的地方只剩這一個 workflow、一個 job、一個 process；
# `concurrency` 確保同一時刻至多一個 run 在執行，所以持有這把私鑰的 process 永遠
# 只有一個，nonce 序列只有一條，不是「機率上很少撞」而是「結構上不可能撞」。
#
# 跟 base-sepolia-keeper.yml 沿用同一套 pattern（單一 signer、GitHub Actions
# cron、缺 secret fail fast、送交易前檢查 gas 餘額），只是這裡的 signer
# （FEE_SETTLEMENT_PRIVATE_KEY）跟喂價的 KEEPER_PRIVATE_KEY 是不同的鑰匙、不同
# 的 nonce 序列，所以用獨立的 concurrency group，不跟喂價互相排隊。
on:
  schedule:
    # 名目 10 分鐘；GitHub 排程是 best-effort，實測跟 price-keeper.yml 一樣可能
    # 是 15–170 分鐘。這不是喂價那種 liveness 關鍵路徑（買方已經拿到資料、已經
    # 付款，這裡只影響分潤多久才上鏈），所以 best-effort 可以接受，但代表佇列裡
    # 的項目可能等上一段時間才被結算——見 docs/KNOWN_LIMITATIONS.md §14。
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# 獨立的 group：FEE_SETTLEMENT_PRIVATE_KEY 跟 KEEPER_PRIVATE_KEY 是不同的鑰匙，
# 這支 workflow 不會跟喂價系列 workflow 搶同一個 nonce 序列，不需要共用 group。
concurrency:
  group: x402-settlement-worker
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 審查 H1（PR #200）：私鑰改放 environment secret，只有引用這個 environment 的 job 拿得到；
    # 舊分支／舊 run 上的 workflow 沒有引用它，repo 層級的同名 secret 刪除後就拿不到私鑰。
    # environment 還沒建立或沒放這個 secret 時，secrets.X 退回 repo 層級的同名 secret，行為不變
    # （docs.github.com「Secrets reference」：environment 層級優先）。
    # deployment: false：只取 secrets，不在每次排程建立 deployment 紀錄。步驟見 ops/keeper-trigger/README.md。
    environment:
      name: settlement
      deployment: false
    env:
      FEE_SETTLEMENT_PRIVATE_KEY: ${{ secrets.FEE_SETTLEMENT_PRIVATE_KEY }}
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # P0 收款守門（settlement-worker.ts payoutPreflight）：PAY_TO 必須是 signer 的 EOA，
      # X402_FEE_ROUTER 的 platformTreasury 不可是外洩／EIP-7702 委派地址。兩者都是公開
      # 地址，用 repository variables（不是 secrets）。PAY_TO 未設 → worker fail-closed。
      PAY_TO: ${{ vars.PAY_TO }}
      X402_FEE_ROUTER: ${{ vars.X402_FEE_ROUTER }}
      # 線上 signal-api 的 base URL：worker 會讀它 `GET /` 公布的 payTo，必須 = 結算 signer。
      # CI 上是必填（GITHUB_ACTIONS=true 時未設 → preflight 失敗），下方 fail-fast 也會先檢查。
      SIGNAL_API_URL: ${{ vars.SIGNAL_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail fast when secrets are missing
        run: |
          set -euo pipefail
          missing=()
          [ -z "${FEE_SETTLEMENT_PRIVATE_KEY:-}" ] && missing+=(FEE_SETTLEMENT_PRIVATE_KEY)
          [ -z "${BASE_SEPOLIA_RPC_URL:-}" ] && missing+=(BASE_SEPOLIA_RPC_URL)
          [ -z "${UPSTASH_REDIS_REST_URL:-}" ] && missing+=(UPSTASH_REDIS_REST_URL)
          [ -z "${UPSTASH_REDIS_REST_TOKEN:-}" ] && missing+=(UPSTASH_REDIS_REST_TOKEN)
          [ -z "${PAY_TO:-}" ] && missing+=("PAY_TO (repository variable)")
          [ -z "${X402_FEE_ROUTER:-}" ] && missing+=("X402_FEE_ROUTER (repository variable)")
          [ -z "${SIGNAL_API_URL:-}" ] && missing+=("SIGNAL_API_URL (repository variable)")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少 secrets / repository variables：${missing[*]} —— 結算 worker 無法運作。"
            exit 1
          fi

      # 見 base-sepolia-keeper.yml 的同名步驟：先講清楚是不是餘額問題，不要讓
      # 「gas 用完」跟「RPC 掛了」長得一樣。這支一次最多處理到 SETTLEMENT_BATCH_SIZE
      # 筆（預設 25），每筆最多 3 個 tx（mint/approve/route），比喂價單筆更耗 gas，
      # 門檻相應調高。
      - name: Check settlement signer gas balance
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Warn before the tank runs dry
        env:
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          PK: ${{ secrets.FEE_SETTLEMENT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ADDR=$(cast wallet address --private-key "$PK")
          BAL=$(cast balance "$ADDR" --rpc-url "${RPC_URL:-https://sepolia.base.org}")
          ETH=$(cast from-wei "$BAL")
          echo "settlement signer $ADDR 餘額 $ETH ETH"
          if [ "$(echo "$ETH < 0.05" | bc -l)" = "1" ]; then
            echo "::warning::settlement signer 餘額只剩 $ETH ETH。請補 gas，否則分潤結算會停。"
          fi
          if [ "$(echo "$ETH < 0.005" | bc -l)" = "1" ]; then
            echo "::error::settlement signer 餘額 $ETH ETH，不足以送出交易。"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      # vars.X402_FEE_ROUTER 是 repository variable，靜態檢查（consistency.yml）看不到
      # 它的值，所以在執行期比對設定來源 frontend/src/contracts/x402.ts。填成 MockOracle、
      # V1 FeeRouter 或舊部署都會在送任何交易之前失敗。
      - name: Assert X402_FEE_ROUTER matches frontend config
        run: |
          set -euo pipefail
          EXPECTED=$(node scripts/check-addresses.mjs --print 84532 X402FeeRouter)
          if [ "$(printf '%s' "$X402_FEE_ROUTER" | tr 'A-F' 'a-f')" != "$(printf '%s' "$EXPECTED" | tr 'A-F' 'a-f')" ]; then
            echo "::error::vars.X402_FEE_ROUTER=$X402_FEE_ROUTER 與 frontend/src/contracts/x402.ts 的 $EXPECTED 不一致 —— 分潤會送進錯的合約。"
            exit 1
          fi
          echo "X402_FEE_ROUTER=$X402_FEE_ROUTER 與設定來源一致 ✓"

      - name: Install agent deps
        working-directory: agent
        run: npm ci --no-audit --no-fund

      # 失敗率門檻、死信判斷都在腳本自己裡面做（見 settlement-worker.ts），
      # exit code 直接就是判斷依據，不需要像 keeper 系列那樣另外 grep 輸出行。
      - name: Drain settlement queue
        working-directory: agent
        run: npx tsx signal-api/src/settlement-worker.ts
