# 測試用 fixture（不是真的 workflow；不在 .github/workflows 底下，GitHub 不會執行）。
# 最小但合規的 admin workflow：precheck 在核准之前檢查、approve 只核准、admin-call 第一個 step 守門。
name: fixture admin
on:
  workflow_dispatch:
    inputs:
      target:
        required: true
permissions:
  contents: read
jobs:
  precheck:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: precheck
        env:
          R: ${{ github.ref }}
          N: ${{ github.run_attempt }}
          BLOCKED: ${{ vars.KEEPER_TRIGGER_ACTOR }}
          A: ${{ github.actor }}
          T: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [ "$R" != "refs/heads/master" ]; then
            exit 1
          fi
          if [ "$N" != "1" ]; then
            exit 1
          fi
          if [ -n "$BLOCKED" ] && { [ "$A" = "$BLOCKED" ] || [ "$T" = "$BLOCKED" ]; }; then
            exit 1
          fi
  approve:
    # needs 的陣列寫法也要接受
    needs: [precheck]
    runs-on: ubuntu-latest
    environment: admin-approval
    steps:
      - name: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED_ACTOR: ${{ vars.KEEPER_TRIGGER_ACTOR }}
        run: |
          # 文字裡提到 secrets.KEEPER_PRIVATE_KEY 不算引用（不在運算式裡）。
          echo "approved"
  admin-call:
    needs: [approve]
    runs-on: ubuntu-latest
    environment:
      name: keeper
      deployment: false
    steps:
      - name: guard
        env:
          THE_REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$THE_REF" != "refs/heads/master" ]; then
            echo "wrong ref"
            exit 1
          fi
          if [ "${ATTEMPT}" != "1" ]; then
            exit 1
          fi
      - name: send
        env:
          PK: ${{ secrets.KEEPER_PRIVATE_KEY }}
          TARGET: ${{ inputs.target }}
        run: echo "send"
