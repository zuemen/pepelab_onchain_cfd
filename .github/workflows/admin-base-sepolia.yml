name: Admin — Base Sepolia owner call

# Runs an owner-only call on any Base Sepolia contract using the keeper key
# stored in repo secrets. Manual trigger only.
#
# 鏈上實況（2026-08-06 稽核實測，取代先前那段已過期的警告）：
#   - KEEPER_PRIVATE_KEY = 0x540aECD37E7A7885824e7b7e996eBddfb842ef17
#   - 該地址在 Base Sepolia 的餘額約 **0.05 ETH**（不再是 0），gas 沒問題
#   - `MockOracle 0xeD90c4F3…0Aa3` 的 owner **已是** 0x540aECD3…ef17
#     → 對 MockOracle 的 owner-only 呼叫（updatePrice / addAsset…）可以從這裡送
#   - 但 `PerpetualExchange 0xEf75…c072`、`MockUSDC`、`PepeToken`、`InsuranceVault`
#     的 owner **仍是舊部署者 0xE80A8136…Eb93**
#     → 針對這些合約（含本 workflow 的預設 target）的呼叫仍會 revert
#
# 0xE80A8136…Eb93 的私鑰在 public repo 的 git 歷史中，必須先輪替再談其他事：
# 見 docs/RUNBOOK_KEY_ROTATION.md。在輪替完成前，這個 workflow 只對 MockOracle 有用。
#
# 白名單：`function` 是 choice 型別，只能從下方 options 選；`args` 逐一做格式
# 驗證後以陣列傳給 cast，不再內插進 shell 字串。2026-08-06 之前這裡是
# `cast send "$TARGET" "${{ github.event.inputs.function }}" ${{ ... args }}`，
# 任何有 write 權限的人都能藉此在持有 KEEPER_PRIVATE_KEY 的 job 裡執行任意指令
# 並把金鑰外送（稽核 O-4）。
#
# 要新增可呼叫的函式，請改這個檔案的 options —— 這是刻意的摩擦。
#
# NOTE: anyone with write access to this repo can effectively act as the
# contract owner through this workflow — do not accept external changes to
# workflow files.
#
# 審查 H1（PR #200）：ops/keeper-trigger 的 Worker 持有 Actions: write 的 fine-grained
# token，而 Actions: write 就能 dispatch 這支 workflow（以 KEEPER_PRIVATE_KEY 做
# transferOwnership／updatePrice／mint…）。所以分成兩個 job：
#
#   approve     綁 `environment: admin-approval`（只有 required reviewers＋branch policy，
#               **不放 secret**）。人工核准後才開始；Worker 的 token 沒有 Deployments
#               權限，無法代為核准。引用不存在的 environment 時 GitHub 會自動建立一個
#               沒有保護規則的同名 environment，所以 gate step 讀它的設定，沒有 required
#               reviewers 就 fail-closed。
#   admin-call  needs: approve，才進 concurrency group、才從 `keeper` environment 取私鑰。
#
# 審查 H2（第二輪）：之前 concurrency 寫在 workflow 層級，等核准的 job 仍占住與 keeper
# 共用的 group，keeper 排程會排隊到核准或逾時（最久 30 天）。現在 concurrency 只在
# admin-call 的 job 層級：job 層級 concurrency 可以用 `needs` context（docs.github.com
# 「Workflow syntax」jobs.<job_id>.concurrency），也就是在前置 job 完成後才求值、才
# 進 group；approve 等待期間不占 group。設定步驟見 ops/keeper-trigger/README.md。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target contract address (default: PerpetualExchange)"
        required: true
        default: "0x827eA0c62a32e995927101259042F8A27D99124D"
      function:
        description: "Function signature (whitelist)"
        required: true
        type: choice
        default: "setMaxPriceAge(uint256)"
        options:
          - "setMaxPriceAge(uint256)"
          - "setExecutionFee(uint256)"
          - "setTradingFeeBps(uint256)"
          - "setMaintenanceMarginBps(uint256)"
          - "settleFunding(bytes32)"
          - "transferOwnership(address)"
          - "updatePrice(bytes32,uint256)"
          - "addAsset(bytes32,uint256)"
          - "mint(address,uint256)"
      args:
        description: "Space-separated arguments (only 0x-hex / decimal / true / false accepted)"
        required: true
        default: "21600"

permissions:
  contents: read
  # 只讀：environment 自檢要呼叫 GET /repos/{repo}/environments/{name}，
  # 這個端點屬於 Actions: read（docs.github.com「Permissions required for GitHub Apps」）。
  actions: read

# 注意：這裡**沒有** workflow 層級的 concurrency（審查 H2）。與 keeper 互斥只在
# admin-call 的 job 層級。

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 名稱改了要同步改下面 gate step 的 ADMIN_ENVIRONMENT。這個 environment 不放 secret。
    environment: admin-approval
    steps:
      - name: Gate — admin-approval 必須有 required reviewers（fail-closed）
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ADMIN_ENVIRONMENT: admin-approval
          REF: ${{ github.ref }}
          # 審查 M4：Worker 改用專用身分（GitHub App 或 org 的 machine account）後，把名稱
          # 設成 repo variable KEEPER_TRIGGER_ACTOR；它觸發（或重跑）的 admin run 一律拒絕。
          # 未設定時不擋（見 ops/keeper-trigger/README.md「觸發者身分」）。
          BLOCKED_ACTOR: ${{ vars.KEEPER_TRIGGER_ACTOR }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [ -n "${BLOCKED_ACTOR:-}" ]; then
            b=$(printf '%s' "$BLOCKED_ACTOR" | tr '[:upper:]' '[:lower:]')
            for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
              if [ "$(printf '%s' "$who" | tr '[:upper:]' '[:lower:]')" = "$b" ]; then
                echo "::error::這次 run 由 keeper 觸發器帳號 $who 觸發，admin workflow 不接受。"
                exit 1
              fi
            done
          fi
          # 只准從 master 執行：其他分支上的這支 workflow 不受本 PR 之後的審查約束。
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::admin workflow 只允許在 refs/heads/master 執行，這次是 $REF"
            exit 1
          fi
          if ! BODY=$(curl -fsS \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/environments/$ADMIN_ENVIRONMENT"); then
            echo "::error::讀不到 environment「$ADMIN_ENVIRONMENT」的設定，拒絕執行（fail-closed）"
            exit 1
          fi
          # protection_rules[] 中 type == required_reviewers 的 reviewers 至少一位。
          # jq 解析失敗或欄位不存在都視為 0。
          N=$(printf '%s' "$BODY" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // [])[]] | length' 2>/dev/null || echo 0)
          if ! [ "${N:-0}" -gt 0 ] 2>/dev/null; then
            echo "::error::environment「$ADMIN_ENVIRONMENT」沒有設定 required reviewers（可能是被 workflow 自動建立的空 environment）。"
            echo "::error::請到 Settings → Environments → $ADMIN_ENVIRONMENT 加上 Required reviewers，見 ops/keeper-trigger/README.md。"
            exit 1
          fi
          echo "environment「$ADMIN_ENVIRONMENT」有 $N 位 required reviewer，本次執行已經過人工核准。"

  admin-call:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 不需要讀 environment 設定，只留 contents: read。
    permissions:
      contents: read
    # 與 base-sepolia-keeper.yml 共用同一個 group：兩者都用 KEEPER_PRIVATE_KEY 對
    # Base Sepolia 送交易，並行會撞 nonce。2026-08-06 04:40 的 dispatch 就與排程重疊過。
    # 只放在這個 job（審查 H2）：approve 等核准時不占 group。預設 queue: single，排隊中
    # 的 admin-call 可能被之後排進來的 keeper run 取代而取消，那就重新 dispatch。
    concurrency:
      group: keeper-key-base-sepolia
      cancel-in-progress: false
    # 私鑰從 keeper environment 取（無 reviewers、branch policy = master）；見 README。
    environment:
      name: keeper
      deployment: false
    env:
      # 所有使用者輸入一律經 env 傳遞，絕不直接內插進 run: 的 shell 字串。
      # 直接讀 inputs（dispatch 當下凍結的值），不經 approve 的 outputs 轉手。
      # 私鑰不放 job 層級：只有真正送交易的 step 拿得到。
      TARGET:   ${{ inputs.target }}
      FUNC:     ${{ inputs.function }}
      ARGS:     ${{ inputs.args }}
    steps:
      # 在任何拿得到私鑰的 step 之前。
      - name: Guard — 只接受 master 上第一次執行
        env:
          REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BLOCKED_ACTOR: ${{ vars.KEEPER_TRIGGER_ACTOR }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::admin workflow 只允許在 refs/heads/master 執行，這次是 $REF"
            exit 1
          fi
          # 只重跑 admin-call（re-run failed jobs／re-run job）會沿用 approve 已成功的結果、
          # 不再經過核准，等於重播一次已核准的呼叫（例如再 mint 一次）。要重試請重新 dispatch。
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::admin-call 不接受重跑（run_attempt=$RUN_ATTEMPT）；請重新 dispatch 並重新核准。"
            exit 1
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [ -n "${BLOCKED_ACTOR:-}" ] && [ "$(lower "$TRIGGERING_ACTOR")" = "$(lower "$BLOCKED_ACTOR")" ]; then
            echo "::error::這次 run 由 keeper 觸發器帳號 $TRIGGERING_ACTOR 觸發，admin workflow 不接受。"
            exit 1
          fi

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Guard — secrets present
        env:
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          PK:      ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RPC_URL:-}" ] || [ -z "${PK:-}" ]; then
            echo "::error::BASE_SEPOLIA_RPC_URL / KEEPER_PRIVATE_KEY secrets not set"
            exit 1
          fi

      - name: Validate inputs
        run: |
          set -euo pipefail

          # target 必須是規範長度的位址字面值。
          if ! printf '%s' "$TARGET" | grep -Eq '^0x[0-9a-fA-F]{40}$'; then
            echo "::error::target 不是合法位址：$TARGET"
            exit 1
          fi

          # function 已由 choice 型別限制，這裡再逐字比對一次（API dispatch 的縱深防禦）。
          # 這份清單必須與上方 inputs.function 的 options 完全一致。
          ALLOWED=(
            "setMaxPriceAge(uint256)"
            "setExecutionFee(uint256)"
            "setTradingFeeBps(uint256)"
            "setMaintenanceMarginBps(uint256)"
            "settleFunding(bytes32)"
            "transferOwnership(address)"
            "updatePrice(bytes32,uint256)"
            "addAsset(bytes32,uint256)"
            "mint(address,uint256)"
          )
          OK=0
          for f in "${ALLOWED[@]}"; do
            if [ "$FUNC" = "$f" ]; then OK=1; break; fi
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::function 不在白名單內：$FUNC"
            exit 1
          fi

          # args 逐一驗證。只接受 0x-hex、十進位整數、true/false ——
          # 任何空白以外的 shell 元字元都會在這裡被擋下。
          read -r -a ARG_ARR <<< "$ARGS"
          if [ "${#ARG_ARR[@]}" -eq 0 ]; then
            echo "::error::args 不可為空"
            exit 1
          fi
          for a in "${ARG_ARR[@]}"; do
            if ! printf '%s' "$a" | grep -Eq '^(0x[0-9a-fA-F]{1,64}|[0-9]{1,78}|true|false)$'; then
              echo "::error::拒絕引數（只允許 0x-hex / 十進位 / true / false）：$a"
              exit 1
            fi
          done
          echo "驗證通過：$FUNC on $TARGET with ${#ARG_ARR[@]} arg(s)"

      - name: Send owner transaction
        env:
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          PK:      ${{ secrets.KEEPER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # 重新切分成陣列後以 "${ARG_ARR[@]}" 傳給 cast：每個引數都是獨立的
          # argv 元素，不經過任何一次 shell 重新解析。
          read -r -a ARG_ARR <<< "$ARGS"
          echo "Calling $FUNC on $TARGET"
          cast send "$TARGET" "$FUNC" "${ARG_ARR[@]}" \
            --rpc-url "$RPC_URL" \
            --private-key "$PK"
