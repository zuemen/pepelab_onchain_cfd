name = "pepelab-keeper-trigger"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
# 不產生 preview URL（*.workers.dev 的版本預覽網址）；Worker 對 HTTP 一律 404，也不需要。
preview_urls = false

# Workers Logs：cron 的 console.log 與失敗原因可在 dashboard 查（審查 M3）。
[observability]
enabled = true

[triggers]
crons = ["*/20 * * * *"]

[vars]
GITHUB_REPO = "zuemen/pepelab_onchain_cfd"
# 逗號分隔；每個 workflow 各自判斷是否補觸發。
# keeper-rwa-poc.yml：專屬租戶 rwa-poc 的 keeper（由範本產生，docs/TENANT_OPERATIONS.md §1.4）。
WORKFLOW_FILES = "base-sepolia-keeper.yml,price-keeper.yml,keeper-rwa-poc.yml"
WORKFLOW_REF = "master"
MIN_GAP_SEC = "900"
# 改用 GitHub App 時取消註解並填入（兩個都是識別碼，不是秘密；步驟見 README「改用 GitHub App」）。
# 三項（這兩個＋secret GITHUB_APP_PRIVATE_KEY）要一起設定；只設一部分 Worker 會直接失敗。
# GITHUB_APP_ID = ""               # App ID（數字）或 Client ID
# GITHUB_APP_INSTALLATION_ID = ""  # 安裝在本 repo 後取得的 installation ID（數字）

# 憑證一律用 `npx wrangler secret put <名稱>` 設定，不要寫在這裡：
#   GITHUB_APP_PRIVATE_KEY   GitHub App 的私鑰（.pem 原檔內容）
#   GITHUB_TOKEN             擁有者本人的 fine-grained PAT（未設定 App 時使用）
