name: Risk Model

# Phase 1 金融風險模型（risk_model/，見 docs/RISK_MODEL_CFD.md）。
# 跑 pytest（封閉解 vs Monte Carlo、清算價邊界、程式不等式逐點對照、Δ→0 壞帳趨近 0…）
# 與 `run_all.py --quick`、`run_besu.py --quick`（小樣本重現所有圖表，確認整條管線可執行）。
# 不需要任何 secret、不連任何鏈；校準參數讀 risk_model/data/calibrated_params.json（--offline），不連外部 API。
# 用 runner 內建的 python3 建 venv，不另外引入 setup-python（沿用 master 已釘選的 action）。
on:
  push:
    branches: [master]
    paths:
      - 'risk_model/**'
      - '.github/workflows/risk-model.yml'
  pull_request:
    paths:
      - 'risk_model/**'
      - '.github/workflows/risk-model.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + run_all --quick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create venv and install pinned requirements
        run: |
          python3 --version
          python3 -m venv risk_model/.venv
          risk_model/.venv/bin/python -m pip install --upgrade pip
          risk_model/.venv/bin/python -m pip install -r risk_model/requirements.txt

      - name: pytest
        run: risk_model/.venv/bin/python -m pytest risk_model/tests -q

      - name: run_all --quick
        run: risk_model/.venv/bin/python risk_model/run_all.py --quick --offline

      # Phase 3（docs/BESU_CALIBRATION.md）：Besu 特性重新校準的小樣本重現。
      # 只讀 risk_model/data/*.json（不連網），記憶體峰值數百 MB。
      - name: run_besu --quick
        run: risk_model/.venv/bin/python risk_model/run_besu.py --quick
